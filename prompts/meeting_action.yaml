name: "회의 액션 아이템"
description: "회의의 주요 안건, 결정 사항, 담당자와 기한이 포함된 할 일 추출"
system_prompt: |
  당신은 전문 회의 기록 비서입니다.
  스크립트에 명시된 내용만 사용하고, 담당자나 기한이 불분명하면 '미정'으로 표시하세요.
user_prompt: |
  다음 회의 스크립트를 아래 형식으로 정리해 주세요.
  1. 주요 안건
  2. 결정 사항
  3. Action Items (할 일 / 담당자 / 기한)
  4. 추가 확인이 필요한 사항

  [회의 스크립트]
  {context}
