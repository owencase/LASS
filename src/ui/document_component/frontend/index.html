<!doctype html>
<html lang="ko"><meta charset="utf-8">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
#stage { display:flex; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none; box-sizing:border-box; }
img { flex:none; margin:auto; display:block; object-fit:contain; max-width:none; user-select:none; }
#status { position:fixed; bottom:10px; right:12px; padding:5px 10px; border-radius:8px; font:12px sans-serif; background:#64748b22; color:#64748b; pointer-events:none; }
#status:empty { display:none; }
</style>
<div id="stage" aria-busy="false"></div><div id="status" role="status" aria-live="polite"></div>
<script>
const stage = document.getElementById("stage");
const status = document.getElementById("status");
let current = null, args = {}, version = 0;
function resize() {
  if (!current?.naturalWidth) return;
  const base = Math.min(stage.clientWidth / current.naturalWidth, stage.clientHeight / current.naturalHeight);
  const scale = base * (args.fit ? 1 : args.zoom / 100);
  current.style.width = `${Math.round(current.naturalWidth * scale)}px`;
  current.style.height = `${Math.round(current.naturalHeight * scale)}px`;
}
new ResizeObserver(resize).observe(stage);
window.addEventListener("message", async (event) => {
  if (event.data?.type !== "streamlit:render") return;
  args = event.data.args;
  const requested = ++version;
  if (current?.getAttribute("src") === args.url) {
    resize();
    status.textContent = "";
    stage.setAttribute("aria-busy", "false");
    return;
  }
  stage.setAttribute("aria-busy", "true");
  status.textContent = "페이지 준비 중…";
  const next = new Image();
  next.className = "lass-pdf-page";
  next.draggable = false;
  next.alt = `${args.title} · ${args.page_number}페이지`;
  next.src = args.url;
  try {
    await next.decode();
    if (requested !== version) return;
    current = next;
    resize();
    stage.replaceChildren(next);
    stage.scrollTop = stage.scrollLeft = 0;
    status.textContent = "";
  } catch (error) {
    if (requested === version) status.textContent = "페이지를 표시하지 못했습니다. 다시 이동해 주세요.";
  } finally {
    if (requested === version) stage.setAttribute("aria-busy", "false");
  }
});
stage.addEventListener("wheel", (event) => event.preventDefault(), {passive:false});
document.addEventListener("keydown", (event) => {
  if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
  const direction = event.key === "ArrowRight" ? "next" : "previous";
  window.parent.document.querySelector(`[class*="st-key-pdf-${direction}-"] button:not(:disabled)`)?.click();
  event.preventDefault();
});
window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1}, "*");
</script></html>
