<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><style>html,body{margin:0;height:0;overflow:hidden}</style></head>
<body>
<script>
  const parentDocument = window.parent.document;
  let contentLayout = "stack";
  let layoutObserver = null;
  let observedLayout = null;
  let transcriptObserver = null;
  let observedTranscript = null;
  let resizeTimer = null;
  let installedKeyboardHandler = null;
  const keyboardHandlerKey = "__lassPdfKeyboardNavigation";
  let hoverTextObserver = null;
  const hoverTextObserverKey = "__lassHoverTextObserver";
  let pdfStage = null;
  let pdfResizeObserver = null;
  let lastPdfWheelAt = 0;
  let pdfDomObserver = null;
  const pdfDomObserverKey = "__lassPdfDomObserver";
  let pdfSetupFrame = null;

  function sendHeight() {
    window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height:0}, "*");
  }

  function directWrapper(layout, selector) {
    return Array.from(layout.children).find((node) => node.querySelector(selector));
  }

  function clearCenterLayout(layout, documentPane, memoPane) {
    layout.classList.remove("lass-center-side-by-side");
    layout.style.removeProperty("--lass-document-width");
    for (const pane of [documentPane, memoPane]) {
      pane.style.removeProperty("flex");
      pane.style.removeProperty("width");
      pane.style.removeProperty("height");
    }
    layout.querySelectorAll(":scope > .lass-center-resizer").forEach((node) => node.remove());
  }

  function boundedRatio(storageKey, fallback) {
    const saved = Number(window.localStorage.getItem(storageKey));
    return Number.isFinite(saved) && saved >= .25 && saved <= .75 ? saved : fallback;
  }

  function installStackSplitter(layout, documentPane, memoPane) {
    const handle = parentDocument.createElement("div");
    handle.className = "lass-center-resizer lass-horizontal-resizer";
    handle.tabIndex = 0;
    handle.setAttribute("role", "separator");
    handle.setAttribute("aria-orientation", "horizontal");
    handle.setAttribute("aria-label", "PDF와 메모 높이 조절");
    handle.innerHTML = '<span aria-hidden="true"></span>';
    layout.insertBefore(handle, memoPane);

    const available = () => Math.max(260, layout.getBoundingClientRect().height - 5);
    const apply = (documentHeight) => {
      const total = available();
      const bounded = Math.max(130, Math.min(total - 130, documentHeight));
      documentPane.style.setProperty("flex", `0 0 ${bounded}px`, "important");
      documentPane.style.setProperty("height", `${bounded}px`, "important");
      memoPane.style.setProperty("flex", `0 0 ${total - bounded}px`, "important");
      memoPane.style.setProperty("height", `${total - bounded}px`, "important");
      handle.setAttribute("aria-valuenow", String(Math.round(bounded)));
      return bounded;
    };
    handle.lassApplyRatio = (ratio) => apply(available() * ratio);
    handle.lassApplyRatio(boundedRatio("lass-document-height-ratio-v2", .62));

    handle.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startY = event.clientY;
      const startHeight = documentPane.getBoundingClientRect().height;
      handle.classList.add("dragging");
      handle.setPointerCapture(event.pointerId);
      const move = (moveEvent) => apply(startHeight + moveEvent.clientY - startY);
      const finish = () => {
        handle.classList.remove("dragging");
        window.localStorage.setItem(
          "lass-document-height-ratio-v2",
          String(documentPane.getBoundingClientRect().height / available())
        );
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
    handle.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
      event.preventDefault();
      const height = apply(documentPane.getBoundingClientRect().height + (event.key === "ArrowUp" ? -16 : 16));
      window.localStorage.setItem("lass-document-height-ratio-v2", String(height / available()));
    });
  }

  function installSideSplitter(layout, documentPane, memoPane) {
    layout.classList.add("lass-center-side-by-side");
    const handle = parentDocument.createElement("div");
    handle.className = "lass-center-resizer lass-vertical-resizer";
    handle.tabIndex = 0;
    handle.setAttribute("role", "separator");
    handle.setAttribute("aria-orientation", "vertical");
    handle.setAttribute("aria-label", "PDF와 메모 너비 조절");
    handle.innerHTML = '<span aria-hidden="true"></span>';
    layout.insertBefore(handle, memoPane);

    const available = () => Math.max(420, layout.getBoundingClientRect().width - 5);
    const apply = (documentWidth) => {
      const total = available();
      const bounded = Math.max(240, Math.min(total - 220, documentWidth));
      layout.style.setProperty("--lass-document-width", `${bounded}px`);
      handle.setAttribute("aria-valuenow", String(Math.round(bounded)));
      return bounded;
    };
    handle.lassApplyRatio = (ratio) => apply(available() * ratio);
    handle.lassApplyRatio(boundedRatio("lass-document-width-ratio-v1", .62));

    handle.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      const startX = event.clientX;
      const startWidth = documentPane.getBoundingClientRect().width;
      handle.classList.add("dragging");
      handle.setPointerCapture(event.pointerId);
      const move = (moveEvent) => apply(startWidth + moveEvent.clientX - startX);
      const finish = () => {
        handle.classList.remove("dragging");
        window.localStorage.setItem(
          "lass-document-width-ratio-v1",
          String(documentPane.getBoundingClientRect().width / available())
        );
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", finish);
        handle.removeEventListener("pointercancel", finish);
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
    handle.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const width = apply(documentPane.getBoundingClientRect().width + (event.key === "ArrowLeft" ? -16 : 16));
      window.localStorage.setItem("lass-document-width-ratio-v1", String(width / available()));
    });
  }

  function setupCenterLayout() {
    const layout = parentDocument.querySelector(".st-key-lass-document-memo-layout");
    if (!layout) return;
    const documentPane = directWrapper(layout, ".st-key-lass-document-pane");
    const memoPane = directWrapper(layout, ".st-key-lass-memo-pane");
    if (!documentPane) return;
    if (!memoPane) {
      layout.classList.remove("lass-center-side-by-side");
      layout.style.removeProperty("--lass-document-width");
      documentPane.style.removeProperty("flex");
      documentPane.style.removeProperty("width");
      documentPane.style.removeProperty("height");
      layout.querySelectorAll(":scope > .lass-center-resizer").forEach((node) => node.remove());
      return;
    }
    clearCenterLayout(layout, documentPane, memoPane);
    if (contentLayout === "side") installSideSplitter(layout, documentPane, memoPane);
    else installStackSplitter(layout, documentPane, memoPane);

    if (observedLayout !== layout) {
      layoutObserver?.disconnect();
      observedLayout = layout;
      layoutObserver = new ResizeObserver(() => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          const handle = layout.querySelector(":scope > .lass-center-resizer");
          if (!handle?.lassApplyRatio) return;
          const side = handle.classList.contains("lass-vertical-resizer");
          handle.lassApplyRatio(boundedRatio(
            side ? "lass-document-width-ratio-v1" : "lass-document-height-ratio-v2",
            .62
          ));
        }, 100);
      });
      layoutObserver.observe(layout);
    }
  }

  function setupTranscriptAutoscroll() {
    const transcript = parentDocument.querySelector(".st-key-lass-transcript-stream");
    if (!transcript) return;
    transcript.scrollTop = transcript.scrollHeight;
    if (observedTranscript === transcript) return;
    transcriptObserver?.disconnect();
    observedTranscript = transcript;
    transcriptObserver = new MutationObserver(() => {
      window.requestAnimationFrame(() => { transcript.scrollTop = transcript.scrollHeight; });
    });
    transcriptObserver.observe(transcript, {childList:true,subtree:true});
  }

  function isTextEntryTarget(target) {
    if (!(target instanceof window.parent.HTMLElement)) return false;
    return Boolean(target.closest(
      'input, textarea, select, [contenteditable="true"], [role="textbox"], ' +
      '.CodeMirror, .cm-editor, .ProseMirror, .lass-center-resizer'
    ));
  }

  function installPdfKeyboardNavigation() {
    const owner = window.parent;
    const previousHandler = owner[keyboardHandlerKey];
    if (previousHandler) parentDocument.removeEventListener("keydown", previousHandler);

    const handler = (event) => {
      if (event.defaultPrevented || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      if (isTextEntryTarget(event.target)) return;
      if (!parentDocument.querySelector(".lass-pdf-page")) return;
      const direction = event.key === "ArrowLeft" ? "previous" : "next";
      const button = parentDocument.querySelector(
        `[class*="st-key-pdf-${direction}-"] button:not(:disabled)`
      );
      if (!button) return;
      event.preventDefault();
      button.click();
    };
    installedKeyboardHandler = handler;
    owner[keyboardHandlerKey] = handler;
    parentDocument.addEventListener("keydown", handler);
  }

  function resizePdfPage() {
    const stage = pdfStage;
    const page = stage?.querySelector(".lass-pdf-page");
    if (!page?.naturalWidth || !page?.naturalHeight) return;
    const style = window.parent.getComputedStyle(stage);
    const width = Math.max(1, stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const height = Math.max(1, stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom));
    const baseScale = contentLayout === "side" ? width / page.naturalWidth : height / page.naturalHeight;
    const zoom = stage.dataset.fit === "true" ? 1 : Number(stage.dataset.zoom) || 1;
    page.style.width = `${Math.round(page.naturalWidth * baseScale * zoom)}px`;
    page.style.height = `${Math.round(page.naturalHeight * baseScale * zoom)}px`;
  }

  function setupPdfViewer() {
    const stage = parentDocument.querySelector(".lass-pdf-stage");
    if (stage === pdfStage) {
      resizePdfPage();
      return;
    }
    pdfResizeObserver?.disconnect();
    pdfStage = stage;
    if (!stage) return;
    const page = stage.querySelector(".lass-pdf-page");
    if (page) {
      page.draggable = false;
      if (!page.complete) page.addEventListener("load", resizePdfPage, {once:true});
    }
    pdfResizeObserver = new ResizeObserver(resizePdfPage);
    pdfResizeObserver.observe(stage);
    stage.addEventListener("wheel", (event) => {
      if (event.ctrlKey || event.metaKey || !event.deltaY) return;
      event.preventDefault();
      const now = Date.now();
      if (now - lastPdfWheelAt < 300) return;
      const direction = event.deltaY > 0 ? "next" : "previous";
      const button = parentDocument.querySelector(
        `[class*="st-key-pdf-${direction}-"] button:not(:disabled)`
      );
      if (!button) return;
      lastPdfWheelAt = now;
      button.click();
    }, {passive:false});

    let drag = null;
    stage.addEventListener("pointerdown", (event) => {
      if (event.button !== 0 || (stage.scrollWidth <= stage.clientWidth && stage.scrollHeight <= stage.clientHeight)) return;
      drag = {x:event.clientX, y:event.clientY, left:stage.scrollLeft, top:stage.scrollTop};
      stage.classList.add("lass-panning");
      stage.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    stage.addEventListener("pointermove", (event) => {
      if (!drag) return;
      stage.scrollLeft = drag.left - (event.clientX - drag.x);
      stage.scrollTop = drag.top - (event.clientY - drag.y);
    });
    const endDrag = () => {
      drag = null;
      stage.classList.remove("lass-panning");
    };
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);
    stage.addEventListener("lostpointercapture", endDrag);
    resizePdfPage();
  }

  function observePdfViewer() {
    window.parent[pdfDomObserverKey]?.disconnect();
    pdfDomObserver = new MutationObserver(() => {
      if (pdfSetupFrame !== null) return;
      pdfSetupFrame = window.requestAnimationFrame(() => {
        pdfSetupFrame = null;
        setupPdfViewer();
      });
    });
    pdfDomObserver.observe(parentDocument.body, {
      childList:true, subtree:true, attributes:true, attributeFilter:["data-fit", "data-zoom"],
    });
    window.parent[pdfDomObserverKey] = pdfDomObserver;
  }

  function suppressHoverText() {
    const clearTitles = (root) => {
      if (root instanceof window.parent.Element && root.hasAttribute("title")) {
        root.removeAttribute("title");
      }
      root.querySelectorAll?.("[title]").forEach((node) => node.removeAttribute("title"));
    };
    clearTitles(parentDocument);
    window.parent[hoverTextObserverKey]?.disconnect();
    hoverTextObserver = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
        if (mutation.type === "attributes") mutation.target.removeAttribute("title");
        mutation.addedNodes.forEach((node) => clearTitles(node));
      });
    });
    hoverTextObserver.observe(parentDocument.body, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["title"],
    });
    window.parent[hoverTextObserverKey] = hoverTextObserver;
  }

  function setup() {
    setupCenterLayout();
    setupPdfViewer();
    observePdfViewer();
    setupTranscriptAutoscroll();
    installPdfKeyboardNavigation();
    suppressHoverText();
  }

  window.addEventListener("message", (event) => {
    if (event.data?.type !== "streamlit:render") return;
    contentLayout = event.data.args?.content_layout === "side" ? "side" : "stack";
    sendHeight();
    window.setTimeout(setup, 0);
    window.setTimeout(setupTranscriptAutoscroll, 120);
  });
  window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1}, "*");
  sendHeight();
  setup();
  window.addEventListener("unload", () => {
    pdfResizeObserver?.disconnect();
    if (window.parent[pdfDomObserverKey] === pdfDomObserver) {
      pdfDomObserver.disconnect();
      delete window.parent[pdfDomObserverKey];
    }
    if (window.parent[keyboardHandlerKey] === installedKeyboardHandler) {
      parentDocument.removeEventListener("keydown", installedKeyboardHandler);
      delete window.parent[keyboardHandlerKey];
    }
    if (window.parent[hoverTextObserverKey] === hoverTextObserver) {
      hoverTextObserver.disconnect();
      delete window.parent[hoverTextObserverKey];
    }
  });
</script>
</body>
</html>
